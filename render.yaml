# Render Blueprint for the API. The frontend is deployed on Vercel.
services:
  - type: web
    name: eccentric-motors-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: https://rahul-singh-project-assignment-car-showcase.vercel.app
      # Optional: set to a MongoDB Atlas connection string to keep saved
      # builds and bookings across restarts. Without it an in-memory
      # database is used.
      - key: MONGODB_URI
        sync: false
